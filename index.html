<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>A/1 Creative — Get Plugged In</title>
<meta name="description" content="A/1 Creative Agency builds the infrastructure that powers your business — websites, automation, lead capture, bookings, CRM, missed-call recovery, and AI systems." />
<meta name="theme-color" content="#04070d" />
<meta name="color-scheme" content="dark" />
<meta name="robots" content="noindex" />
<meta property="og:title" content="A/1 Creative — Get Plugged In" />
<meta property="og:description" content="We build the infrastructure that powers your business." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2304070d'/%3E%3Ctext x='16' y='22' font-family='system-ui,Arial' font-size='15' font-weight='800' text-anchor='middle' fill='%232a82ff'%3EA%2F1%3C/text%3E%3C/svg%3E" />
<style>
  /* ============================================================
     A/1 Creative — "Get Plugged In" homepage prototype
     Brand tokens sourced verbatim from /brand/tokens.css.
     Deliberate single dark "stage" world (the brand identity is a
     powered-on console). Self-contained: no external requests,
     no webfonts fetched, no forms, no integrations.
     ============================================================ */
  :root{
    --a1-black:#04070d; --a1-navy:#0a1626; --a1-coal:#0b1322;
    --a1-graphite:#1a1d26; --a1-steel:#2a2f3c;
    --a1-silver-0:#f6f8fc; --a1-silver-1:#e7ecf3; --a1-silver-2:#a8b0c2; --a1-silver-3:#525a6c;
    --a1-blue-soft:#9cc6ff; --a1-blue:#2a82ff; --a1-blue-deep:#0b3f9d;
    --a1-gold-soft:#ffe7a8; --a1-gold:#dfb346; --a1-gold-deep:#876514;
    --a1-body:#cdd3df;
    --font-display:"Space Grotesk","SF Pro Display",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --edge:clamp(20px,5vw,64px);
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(120% 90% at 50% 8%, #10192b 0%, #070b14 46%, #03050b 78%, #000 100%);
    color:var(--a1-body); font-family:var(--font-body);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    min-height:100svh; overflow-x:hidden;
  }
  .field{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .field::before{content:"";position:absolute;inset:-2px;
    background-image:
      linear-gradient(to right,rgba(120,150,200,.05) 1px,transparent 1px),
      linear-gradient(to bottom,rgba(120,150,200,.05) 1px,transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(120% 80% at 50% 30%,#000 40%,transparent 78%);
            mask-image:radial-gradient(120% 80% at 50% 30%,#000 40%,transparent 78%);
    opacity:.5}
  .bloom{position:absolute;width:52vw;height:52vw;border-radius:50%;filter:blur(80px);opacity:.20;mix-blend-mode:screen}
  .bloom.blue{left:-14vw;top:2vw;background:radial-gradient(circle,#2a82ff,transparent 62%)}
  .bloom.gold{right:-14vw;bottom:-6vw;background:radial-gradient(circle,#dfb346,transparent 62%);opacity:.14}

  .wrap{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:clamp(20px,3.2vh,40px);
    padding:calc(env(safe-area-inset-top) + 40px) var(--edge) calc(env(safe-area-inset-bottom) + 40px);
    text-align:center}

  .status{display:inline-flex;align-items:center;gap:10px;
    font-family:var(--font-display);font-size:clamp(11px,1.4vw,13px);
    letter-spacing:.28em;text-transform:uppercase;color:var(--a1-silver-2);
    padding:8px 16px;border:1px solid rgba(156,198,255,.16);border-radius:999px;
    background:linear-gradient(180deg,rgba(20,30,48,.5),rgba(8,12,22,.5));backdrop-filter:blur(4px)}
  .status .dot{width:7px;height:7px;border-radius:50%;background:#38507a}
  .status .label b{color:var(--a1-blue-soft);font-weight:600}

  .logo{width:min(38vh,240px);height:auto;display:block;filter:drop-shadow(0 18px 40px rgba(0,0,0,.55))}
  @media (max-width:560px){ .logo{width:min(30vh,190px)} }

  h1{margin:0;font-family:var(--font-display);font-weight:800;
    font-size:clamp(2.6rem,8.4vw,5.3rem);line-height:.98;letter-spacing:-.035em;
    text-wrap:balance;color:var(--a1-silver-0)}
  h1 .glow-word{background:linear-gradient(180deg,#eaf3ff 0%,#9cc6ff 55%,#2a82ff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .lede{margin:0;font-size:clamp(1.05rem,2.4vw,1.5rem);color:var(--a1-silver-1);
    font-weight:500;max-width:34ch;line-height:1.35;text-wrap:balance}
  .caps{margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 10px;justify-content:center;max-width:62ch}
  .caps li{list-style:none;font-family:var(--font-display);font-size:clamp(11px,1.5vw,13px);
    letter-spacing:.04em;color:var(--a1-silver-2);
    padding:5px 12px;border:1px solid rgba(120,150,200,.16);border-radius:8px;background:rgba(14,22,38,.45)}
  .caps li b{color:var(--a1-body);font-weight:600}

  .cta-row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:4px}
  .btn{appearance:none;cursor:pointer;font-family:var(--font-display);font-weight:600;
    font-size:clamp(.95rem,1.7vw,1.05rem);letter-spacing:.01em;
    padding:15px 26px;border-radius:12px;min-height:52px;display:inline-flex;align-items:center;gap:10px;
    text-decoration:none;transition:transform .16s ease,box-shadow .22s ease,background .22s ease,border-color .22s ease}
  .btn:active{transform:translateY(1px)}
  .btn-primary{color:#eaf3ff;border:1px solid #2a82ff;
    background:linear-gradient(180deg,#3a8dff 0%,#2a82ff 46%,#0b3f9d 100%);
    box-shadow:0 10px 30px -8px rgba(42,130,255,.6),inset 0 1px 0 rgba(255,255,255,.25)}
  .btn-primary:hover{transform:translateY(-2px);
    box-shadow:0 16px 40px -8px rgba(42,130,255,.8),inset 0 1px 0 rgba(255,255,255,.3)}
  .btn-ghost{color:var(--a1-silver-1);border:1px solid rgba(156,198,255,.28);
    background:linear-gradient(180deg,rgba(22,32,52,.6),rgba(10,16,28,.6))}
  .btn-ghost:hover{transform:translateY(-2px);border-color:rgba(156,198,255,.55);color:#fff;
    box-shadow:0 12px 30px -12px rgba(42,130,255,.4)}
  .btn .arrow{transition:transform .18s ease}
  .btn-primary:hover .arrow{transform:translateX(3px)}
  .btn:focus-visible{outline:2px solid var(--a1-blue-soft);outline-offset:3px}

  .replay{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:3;
    appearance:none;cursor:pointer;font-family:var(--font-display);font-size:12px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--a1-silver-2);background:rgba(10,16,28,.6);
    border:1px solid rgba(120,150,200,.2);border-radius:999px;padding:9px 14px;
    display:inline-flex;align-items:center;gap:7px;transition:color .2s,border-color .2s}
  .replay:hover{color:#fff;border-color:rgba(156,198,255,.5)}
  .replay:focus-visible{outline:2px solid var(--a1-blue-soft);outline-offset:2px}

  /* ---- assembly motion (static powered state is default / no-JS safe) ---- */
  .lg-A,.lg-slash,.lg-1,.lg-base{transform-box:fill-box;transform-origin:center}
  .lg-bulb{stroke-dasharray:1;stroke-dashoffset:0}   /* pathLength=1 */
  .lg-traces{opacity:1}
  #stageGlow{opacity:.22}

  .is-animating .lg-A     {animation:lockIn .5s cubic-bezier(.2,.8,.2,1) .10s both}
  .is-animating .lg-slash {animation:lockIn .48s cubic-bezier(.2,.8,.2,1) .38s both}
  .is-animating .lg-1     {animation:lockIn .48s cubic-bezier(.2,.8,.2,1) .62s both}
  .is-animating .lg-bulb  {animation:drawBulb .72s ease-in-out .90s both}
  .is-animating .lg-glass {animation:fadeIn .6s ease .95s both}
  .is-animating .lg-base  {animation:screwIn .74s cubic-bezier(.34,1.4,.5,1) 1.34s both}
  .is-animating .lg-traces{animation:traceOn .7s ease-out 1.92s both}
  .is-animating #stageGlow{animation:powerPulse 1s ease-out 1.86s both}
  .is-animating .lg-letters{animation:powerBright 1.1s ease-out 1.92s both}
  .is-animating .status .dot{animation:dotBoot .5s ease 1.9s both}
  .is-animating .reveal{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
  .is-animating .r1{animation-delay:2.05s}
  .is-animating .r2{animation-delay:2.18s}
  .is-animating .r3{animation-delay:2.30s}
  .is-animating .r4{animation-delay:2.42s}

  @keyframes lockIn{0%{opacity:0;transform:translateY(18px) scale(.94);filter:blur(3px)}60%{filter:blur(0)}100%{opacity:1;transform:none;filter:none}}
  @keyframes drawBulb{0%{stroke-dashoffset:1;opacity:.25}100%{stroke-dashoffset:0;opacity:1}}
  @keyframes screwIn{0%{opacity:0;transform:rotate(-70deg) scale(.5)}65%{opacity:1}84%{transform:rotate(7deg) scale(1.03)}100%{opacity:1;transform:none}}
  @keyframes traceOn{0%{opacity:0}100%{opacity:1}}
  @keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
  @keyframes powerPulse{0%{opacity:0}42%{opacity:.95}100%{opacity:.22}}
  @keyframes powerBright{0%{filter:none}42%{filter:drop-shadow(0 0 10px rgba(156,198,255,.85)) drop-shadow(0 0 22px rgba(42,130,255,.6))}100%{filter:drop-shadow(0 0 3px rgba(156,198,255,.25))}}
  @keyframes rise{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:none}}
  @keyframes dotBoot{0%{background:#38507a;box-shadow:0 0 0 0 rgba(42,130,255,0)}100%{background:#2a82ff;box-shadow:0 0 12px 2px rgba(42,130,255,.7)}}

  /* idle "breathing" on the powered halo */
  .lg-halo{animation:breathe 5.5s ease-in-out 2.8s infinite}
  @keyframes breathe{0%,100%{opacity:.16}50%{opacity:.32}}

  @media (prefers-reduced-motion:reduce){
    .is-animating .lg-A,.is-animating .lg-slash,.is-animating .lg-1,.is-animating .lg-bulb,
    .is-animating .lg-glass,.is-animating .lg-base,.is-animating .lg-traces,
    .is-animating #stageGlow,.is-animating .lg-letters,.is-animating .lg-halo,
    .is-animating .status .dot,.is-animating .reveal{animation:none !important}
    #stageGlow{opacity:.24}
    .reveal{opacity:1;transform:none}
    .status .dot{background:#2a82ff;box-shadow:0 0 10px 1px rgba(42,130,255,.6)}
    .replay{display:none}
  }
</style>
</head>
<body>
  <div class="field" aria-hidden="true"><span class="bloom blue"></span><span class="bloom gold"></span></div>

  <main class="wrap">
    <p class="status reveal r1"><span class="dot"></span>
      <span class="label">System status:&nbsp;<b>Online</b></span></p>

    <!-- ===================== ANIMATED A/1 LOGO ===================== -->
    <svg class="logo" viewBox="120 60 784 812" role="img" aria-label="A/1 Creative Agency">
      <defs>
        <radialGradient id="g-glass" cx="50%" cy="42%" r="62%">
          <stop offset="0%" stop-color="#1d2840"/><stop offset="55%" stop-color="#0b1322"/><stop offset="100%" stop-color="#04070d"/>
        </radialGradient>
        <radialGradient id="g-power" cx="50%" cy="44%" r="55%">
          <stop offset="0%" stop-color="#9cc6ff"/><stop offset="45%" stop-color="#2a82ff"/><stop offset="100%" stop-color="#2a82ff" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="g-rim" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f3f6fb"/><stop offset="22%" stop-color="#8d97ac"/><stop offset="50%" stop-color="#e2e7ef"/><stop offset="78%" stop-color="#5c6478"/><stop offset="100%" stop-color="#c5cbd8"/>
        </linearGradient>
        <linearGradient id="g-chrome" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f6f8fc"/><stop offset="14%" stop-color="#a8b0c2"/><stop offset="32%" stop-color="#e7ecf3"/><stop offset="54%" stop-color="#7d8597"/><stop offset="74%" stop-color="#dfe4ee"/><stop offset="100%" stop-color="#525a6c"/>
        </linearGradient>
        <linearGradient id="g-blue" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#9cc6ff"/><stop offset="50%" stop-color="#2a82ff"/><stop offset="100%" stop-color="#0b3f9d"/>
        </linearGradient>
        <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffe7a8"/><stop offset="50%" stop-color="#dfb346"/><stop offset="100%" stop-color="#876514"/>
        </linearGradient>
        <linearGradient id="g-base" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3b4253"/><stop offset="30%" stop-color="#181b24"/><stop offset="60%" stop-color="#2a2f3c"/><stop offset="100%" stop-color="#070912"/>
        </linearGradient>
        <linearGradient id="g-ring" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#5a6275"/><stop offset="50%" stop-color="#cdd3df"/><stop offset="100%" stop-color="#1a1d26"/>
        </linearGradient>
        <linearGradient id="g-blueTint" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#2a82ff" stop-opacity="0.22"/><stop offset="100%" stop-color="#2a82ff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="g-goldTint" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#dfb346" stop-opacity="0"/><stop offset="100%" stop-color="#dfb346" stop-opacity="0.22"/>
        </linearGradient>
        <filter id="g-glow" x="-25%" y="-25%" width="150%" height="150%">
          <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="g-spark" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
        <clipPath id="g-bulbClip">
          <path d="M 422 700 C 250 680, 180 530, 180 400 C 180 230, 300 80, 512 80 C 724 80, 844 230, 844 400 C 844 530, 774 680, 602 700 Z"/>
        </clipPath>
      </defs>

      <ellipse id="stageGlow" cx="512" cy="400" rx="300" ry="330" fill="url(#g-power)"/>
      <ellipse class="lg-halo" cx="512" cy="400" rx="240" ry="270" fill="url(#g-power)" opacity=".16"/>

      <g class="lg-glass">
        <path d="M 422 700 C 250 680, 180 530, 180 400 C 180 230, 300 80, 512 80 C 724 80, 844 230, 844 400 C 844 530, 774 680, 602 700 Z" fill="url(#g-glass)"/>
        <g clip-path="url(#g-bulbClip)">
          <rect x="180" y="80" width="332" height="620" fill="url(#g-blueTint)"/>
          <rect x="512" y="80" width="332" height="620" fill="url(#g-goldTint)"/>
        </g>
      </g>
      <path class="lg-bulb" pathLength="1" fill="none" stroke="url(#g-rim)" stroke-width="6"
        d="M 422 700 C 250 680, 180 530, 180 400 C 180 230, 300 80, 512 80 C 724 80, 844 230, 844 400 C 844 530, 774 680, 602 700 Z"/>

      <g class="lg-traces" clip-path="url(#g-bulbClip)" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <g stroke="url(#g-blue)" stroke-width="3.2" filter="url(#g-glow)">
          <path d="M 250 250 L 312 250 L 312 312"/><path d="M 224 420 L 290 420 L 290 484"/><path d="M 268 596 L 332 596"/>
        </g>
        <g fill="#9cc6ff" filter="url(#g-spark)">
          <circle cx="250" cy="250" r="6"/><circle cx="312" cy="312" r="6"/><circle cx="224" cy="420" r="6"/><circle cx="290" cy="484" r="6"/><circle cx="268" cy="596" r="6"/><circle cx="332" cy="596" r="6"/>
        </g>
        <g stroke="url(#g-gold)" stroke-width="3.2" filter="url(#g-glow)">
          <path d="M 774 250 L 712 250 L 712 312"/><path d="M 800 420 L 734 420 L 734 484"/><path d="M 756 596 L 692 596"/>
        </g>
        <g fill="#ffe7a8" filter="url(#g-spark)">
          <circle cx="774" cy="250" r="6"/><circle cx="712" cy="312" r="6"/><circle cx="800" cy="420" r="6"/><circle cx="734" cy="484" r="6"/><circle cx="756" cy="596" r="6"/><circle cx="692" cy="596" r="6"/>
        </g>
      </g>

      <g class="lg-letters">
        <g class="lg-A" filter="url(#g-glow)">
          <path fill="url(#g-chrome)" fill-rule="evenodd" d="M 345 570 L 425 310 L 505 570 L 470 570 L 460 540 L 390 540 L 380 570 Z M 405 490 L 425 360 L 445 490 Z"/>
          <path fill="#e7ecf3" opacity=".85" d="M 397 504 L 453 504 L 449 520 L 401 520 Z"/>
        </g>
        <path class="lg-slash" filter="url(#g-glow)" fill="url(#g-chrome)" d="M 540 310 L 526 310 L 498 570 L 512 570 Z"/>
        <path class="lg-1" filter="url(#g-glow)" fill="url(#g-chrome)" d="M 560 310 L 635 310 L 635 540 L 670 540 L 670 570 L 555 570 L 555 540 L 600 540 L 600 360 L 560 310 Z"/>
      </g>

      <g class="lg-base">
        <path d="M 410 698 L 614 698 L 624 730 L 400 730 Z" fill="url(#g-base)" stroke="#0a0c12" stroke-width="1"/>
        <rect x="402" y="734" width="220" height="20" rx="4" fill="url(#g-base)" stroke="url(#g-ring)" stroke-width="1"/>
        <rect x="402" y="758" width="220" height="20" rx="4" fill="url(#g-base)" stroke="url(#g-ring)" stroke-width="1"/>
        <rect x="402" y="782" width="220" height="20" rx="4" fill="url(#g-base)" stroke="url(#g-ring)" stroke-width="1"/>
        <path d="M 410 806 L 614 806 L 596 850 L 428 850 Z" fill="url(#g-base)" stroke="#0a0c12" stroke-width="1"/>
        <ellipse cx="512" cy="858" rx="60" ry="14" fill="#050609"/>
      </g>
    </svg>

    <h1 class="reveal r2">Get <span class="glow-word">Plugged&nbsp;In</span></h1>
    <p class="lede reveal r2">We build the infrastructure that powers your business.</p>

    <ul class="caps reveal r3" aria-label="What we build">
      <li><b>Websites</b></li><li>Automation</li><li>Lead capture</li><li>Bookings</li>
      <li>CRM</li><li>Missed-call recovery</li><li>AI systems</li>
    </ul>

    <div class="cta-row reveal r4">
      <a class="btn btn-primary" href="#" role="button">Start Your Upgrade <span class="arrow">&rarr;</span></a>
      <a class="btn btn-ghost" href="#" role="button">Take the Assessment</a>
    </div>
  </main>

  <button class="replay" type="button" aria-label="Replay the logo build animation">&#8635; Replay build</button>

<script>
  (function(){
    var reduce=window.matchMedia('(prefers-reduced-motion: reduce)');
    function play(){
      if(reduce.matches)return;              /* static powered state; no motion */
      document.body.classList.remove('is-animating');
      void document.body.offsetWidth;         /* force reflow to restart timeline */
      document.body.classList.add('is-animating');
    }
    if('requestAnimationFrame' in window){requestAnimationFrame(function(){requestAnimationFrame(play);});}
    else{play();}
    var btn=document.querySelector('.replay');
    if(btn){btn.addEventListener('click',play);}
  })();
</script>
</body>
</html>
