# Netlify configuration for the A1 Creative marketing site (static) + the
# serverless quote-intake function. Netlify ignores vercel.json.

[build]
  publish = "."
  functions = "netlify/functions"
  # This is a hand-coded static site — there is no bundler step. Setting the
  # command here (file config overrides the Netlify UI build settings) stops a
  # leftover "npm run build" from running and failing on a branch that has no
  # Vite entry point.
  command = "echo 'A1 Creative static marketing site — no build step required.'"

[build.environment]
  # Node 18+ is required for the global fetch() used by the function.
  NODE_VERSION = "20"

# Expose the function at a clean, same-origin path. status = 200 makes this a
# rewrite (not a redirect), preserving the POST method and keeping the request
# same-origin so no CORS handling is needed.
[[redirects]]
  from = "/api/submit-lead"
  to = "/.netlify/functions/submit-lead"
  status = 200
  force = true

# Diagnostic: reports which env vars are present in THIS deploy context + a live
# Airtable connectivity test. Booleans/status only — no secret values. Temporary.
[[redirects]]
  from = "/api/config-check"
  to = "/.netlify/functions/config-check"
  status = 200
  force = true

# /quote and /assessment are now real customer-facing pages (quote.html and
# assessment.html), served by Netlify's clean-URL handling — no redirect needed.
# The QR-code permalink /quote therefore opens the branded quote form directly.

# Twilio voice + SMS webhooks. Clean, same-origin paths Cecil pastes into the
# Twilio console. status = 200 (rewrite) preserves the POST + the original URL
# so the X-Twilio-Signature check validates against the public path.
[[redirects]]
  from = "/api/twilio/voice"
  to = "/.netlify/functions/twilio-voice"
  status = 200
  force = true

[[redirects]]
  from = "/api/twilio/missed-call"
  to = "/.netlify/functions/twilio-missed-call"
  status = 200
  force = true

[[redirects]]
  from = "/api/twilio/voicemail"
  to = "/.netlify/functions/twilio-voicemail"
  status = 200
  force = true

[[redirects]]
  from = "/api/twilio/sms"
  to = "/.netlify/functions/twilio-sms"
  status = 200
  force = true

# Canonical legal paths (the consent box + A2P registration link to these).
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

# Old/variant legal URLs → canonical, so no link 404s (A2P reviewers check these).
[[redirects]]
  from = "/privacy-policy"
  to = "/privacy"
  status = 301

[[redirects]]
  from = "/terms-and-conditions"
  to = "/terms"
  status = 301

# Baseline security headers for the static site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
